<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Personal Finance Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/forgotPassword.css">
</head>
<body>
  <div class="header">
    <section class="split-header">
      <div class="header-left">
        <a href="../index.html"><img src="../assets/logo/logo.png" alt="Logo" class="logo"></a>
        <p class="heading-title">Personal Finance Tracker</p>
      </div>
      <div class="header-right">
        <nav>
          <ul class="landing-links">
            <a class="howItWorks" href="#">How it works</a>
            <a class="features" href="#">Features</a>
            <a href="../pages/login.html">
              <button class="login-button">Login</button>
            </a>
          </ul>
        </nav>
      </div>
    </section>
  </div>

  <main class="forgot-page">
    <section class="forgot-card">
      <header class="card-header">
        <h1>Reset your password</h1>
        <p>Enter the email linked to your account and we will send a reset link.</p>
      </header>

      <form class="forgot-form" action="/forgot-password" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <p class="form-hint">We will email reset instructions if the account exists.</p>
        <button type="submit">Send reset link</button>
      </form>

      <footer class="card-footer">
        <p>Remembered your password? <a href="login.html">Log in</a></p>
        <a class="back-home" href="../index.html">&lt;- Back to home</a>
      </footer>
    </section>
  </main>
</body>
</html>
